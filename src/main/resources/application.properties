spring.application.name=mini-prj
server.port=8111

spring.datasource.url=jdbc:mysql://localhost:3306/mini_ai_prj?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json

jwt.secret=${JWT_SECRET}
jwt.access-exp-ms=1800000
jwt.refresh-exp-ms=604800000

kakao.client-id=${KAKAO_CLIENT_ID}
kakao.client-secret=${KAKAO_CLIENT_SECRET}
kakao.redirect-uri=http://localhost:3000/oauth/kakao

# rag setting
rag.base-url=#{RAG_BASE_URL://localhost:8000}
rag.service-token=${SERVICE_TOKEN}
rag.top-k=4
rag-timeout=30s
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Toss Payments Secret Key
toss.payments.secret-key=${TOSS_SECRET_KEY}